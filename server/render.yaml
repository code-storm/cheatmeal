services:
  - type: web
    name: cheatmeal-api
    runtime: node
    plan: free
    rootDir: server
    # --include=dev overrides npm's default of silently skipping
    # devDependencies whenever NODE_ENV=production is set (see the
    # envVars below) - typescript/prisma/tsx all live there but are
    # genuinely needed to build and start this service, not just for
    # local development.
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_JWT_SECRET
        sync: false
      - key: CLIENT_ORIGIN
        value: https://cheatmeal-theta.vercel.app
      - key: NODE_ENV
        value: production
